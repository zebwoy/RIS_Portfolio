[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Local dev: proxy /api/* → Netlify Functions
[dev]
  command     = "npm run dev:vite"
  targetPort  = 5173
  port        = 8888
  autoLaunch  = true

# Route all /api/* calls to the matching function
# force = true preserves the original HTTP method (POST stays POST)
[[redirects]]
  from   = "/api/:function"
  to     = "/.netlify/functions/:function"
  status = 200
  force  = true

# SPA fallback – send all non-asset routes to React
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  # Bundle each function with its node_modules (ESM)
  node_bundler = "esbuild"
